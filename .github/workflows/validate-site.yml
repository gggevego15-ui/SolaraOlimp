name: Validate Solara Olimp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>", html, re.I)
          if not scripts:
              raise SystemExit("No inline JavaScript found in index.html")
          Path("/tmp/solara-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s)")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/solara-inline.js
      - name: Check quiz review features
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="resultInsights"',
              'id="reviewFilters"',
              'data-review-filter="incorrect"',
              'data-review-filter="unanswered"',
              "function explainMistake(",
              "function renderResultInsights(",
              "function applyReviewFilter(",
              'api("answer"',
              "await session.pendingSave;",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing quiz review features: " + ", ".join(missing))
          print("Quiz review UI and explanation functions are present")
          PY
      - name: Check 1.1.0 subject integration
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          api = Path("supabase/functions/olimp-api/index.ts").read_text(encoding="utf-8")
          subjects = {
              "biology": "Биология",
              "astronomy": "Астрономия",
              "ecology": "Экология",
          }
          if "MIRPGHCBAE" not in html:
              raise SystemExit("Frontend code validation excludes one or more new subject prefixes")
          for key, label in subjects.items():
              if html.count(f'<option value="{key}">{label}</option>') != 2:
                  raise SystemExit(f"Expected teacher and student selectors for {label}")
              if f'"{key}"' not in api:
                  raise SystemExit(f"API does not mention subject {key}")
              if f'subject==="{key}"' not in html:
                  raise SystemExit(f"Missing question visual branch for {key}")
          migration_paths = list(Path("supabase/migrations").glob("*add_biology_astronomy_ecology.sql"))
          if not migration_paths:
              raise SystemExit("Missing database migration for new subjects")
          migration = migration_paths[0].read_text(encoding="utf-8")
          if "olimp_sessions_code_check" not in migration:
              raise SystemExit("Missing database migration for new subjects")
          print("All 1.1.0 subjects are present in UI, API, visuals and migration")
          PY
      - name: Load live Supabase API config
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          api_url = re.search(r'const API_URL="([^"]+)"', html)
          api_key = re.search(r'const API_KEY="([^"]+)"', html)
          if not api_url or not api_key:
              raise SystemExit("Could not read public API configuration from index.html")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SOLARA_API_URL={api_url.group(1)}\n")
              env.write(f"SOLARA_API_KEY={api_key.group(1)}\n")
          PY
      - name: Smoke test live Supabase API
        run: |
          curl --fail-with-body --silent --show-error "$SOLARA_API_URL" \
            -X POST \
            -H "apikey: $SOLARA_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{"action":"health"}' \
            -o /tmp/solara-api-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("/tmp/solara-api-health.json").read_text(encoding="utf-8"))
          expected = {"math", "info", "rus", "physics", "geography", "history", "chemistry", "biology", "astronomy", "ecology"}
          if response.get("ok") is not True or response.get("service") != "olimp-api" or response.get("version") != "1.1.0":
              raise SystemExit(f"Unexpected API health response: {response}")
          if set(response.get("subjects", [])) != expected:
              raise SystemExit("Live API subject list does not match Solara Olimp 1.1.0")
          print("Live Supabase API health check passed for all 10 subjects")
          PY
